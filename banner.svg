<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Animated profile banner">
  <title>Profile Banner</title>

  <defs>
    <!-- ===== Gradients ===== -->
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#7c5cff"/>
      <stop offset="0.25" stop-color="#22d3ee"/>
      <stop offset="0.5"  stop-color="#f472b6"/>
      <stop offset="0.75" stop-color="#22d3ee"/>
      <stop offset="1"    stop-color="#7c5cff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1200 0" to="0 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="underlineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#7c5cff"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1"   stop-color="#f472b6"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1"    stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="auroraA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c5cff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>

    <!-- ===== Filters ===== -->
    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>

    <!-- rounded panel -->
    <clipPath id="round"><rect x="0" y="0" width="1200" height="380" rx="24"/></clipPath>

    <!-- name text used for the shine clip -->
    <text id="nameText" x="600" y="182" text-anchor="middle"
      font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800"
      letter-spacing="1">STEVEN WIMBERLY</text>
    <clipPath id="nameClip"><use xlink:href="#nameText"/></clipPath>

    <!-- role window clip (slot machine) -->
    <clipPath id="roleWindow"><rect x="595" y="222" width="500" height="52"/></clipPath>

    <style>
      @keyframes floatUp {
        0%   { transform: translateY(0);    opacity: 0; }
        10%  { opacity: 0.9; }
        90%  { opacity: 0.9; }
        100% { transform: translateY(-360px); opacity: 0; }
      }
      @keyframes drift1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(120px,40px)} }
      @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-140px,-30px)} }
      @keyframes drift3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(80px,-50px)} }
      @keyframes scan   { 0%{transform:translateX(-200px);opacity:0} 8%{opacity:.6} 92%{opacity:.6} 100%{transform:translateX(1300px);opacity:0} }
      @keyframes shineSweep { 0%{transform:translateX(-700px)} 22%{transform:translateX(700px)} 100%{transform:translateX(700px)} }
      @keyframes slot {
        0%,13%     { transform: translateY(0); }
        16.6%,29.6%{ transform: translateY(-52px); }
        33.3%,46.3%{ transform: translateY(-104px); }
        50%,63%    { transform: translateY(-156px); }
        66.6%,79.6%{ transform: translateY(-208px); }
        83.3%,100% { transform: translateY(-260px); }
      }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes pulseLine { 0%,100%{opacity:.55; transform:scaleX(.85)} 50%{opacity:1; transform:scaleX(1)} }
      @keyframes borderGlow { 0%,100%{opacity:.35} 50%{opacity:.8} }

      .p    { animation: floatUp 9s linear infinite; }
      .a1   { animation: drift1 14s ease-in-out infinite; }
      .a2   { animation: drift2 18s ease-in-out infinite; }
      .a3   { animation: drift3 16s ease-in-out infinite; }
      .scan { animation: scan 7s ease-in-out infinite; }
      .shine{ animation: shineSweep 5s ease-in-out infinite; }
      .slot { animation: slot 16s cubic-bezier(.7,0,.2,1) infinite; }
      .cursor { animation: blink 1s step-end infinite; }
      .uline  { animation: pulseLine 4s ease-in-out infinite; transform-origin: 600px 210px; }
      .brd    { animation: borderGlow 5s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <!-- base -->
    <rect width="1200" height="380" fill="#0a0a12"/>
    <rect width="1200" height="380" fill="#0a0a12"/>

    <!-- aurora blobs -->
    <g filter="url(#blurBig)">
      <ellipse class="a1" cx="260" cy="120" rx="260" ry="180" fill="url(#auroraA)"/>
      <ellipse class="a2" cx="950" cy="280" rx="300" ry="200" fill="url(#auroraB)"/>
      <ellipse class="a3" cx="620" cy="60"  rx="240" ry="160" fill="url(#auroraC)"/>
    </g>

    <!-- faint grid -->
    <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
      <path d="M0 95 H1200 M0 190 H1200 M0 285 H1200"/>
      <path d="M150 0 V380 M300 0 V380 M450 0 V380 M600 0 V380 M750 0 V380 M900 0 V380 M1050 0 V380"/>
    </g>

    <!-- scan line -->
    <rect class="scan" x="0" y="0" width="140" height="380" fill="url(#auroraB)" opacity="0.5"/>

    <!-- particles -->
    <g fill="#ffffff">
      <circle class="p" cx="120"  cy="380" r="2"   style="animation-delay:0s"/>
      <circle class="p" cx="240"  cy="380" r="1.5" style="animation-delay:1.2s"/>
      <circle class="p" cx="360"  cy="380" r="2.4" style="animation-delay:2.4s"/>
      <circle class="p" cx="500"  cy="380" r="1.8" style="animation-delay:.6s"/>
      <circle class="p" cx="700"  cy="380" r="2.2" style="animation-delay:3s"/>
      <circle class="p" cx="840"  cy="380" r="1.6" style="animation-delay:1.8s"/>
      <circle class="p" cx="980"  cy="380" r="2.5" style="animation-delay:4.2s"/>
      <circle class="p" cx="1080" cy="380" r="1.7" style="animation-delay:2.1s"/>
      <circle class="p" cx="60"   cy="380" r="1.9" style="animation-delay:5s"/>
      <circle class="p" cx="1140" cy="380" r="2.1" style="animation-delay:3.6s"/>
    </g>

    <!-- greeting -->
    <text x="600" y="92" text-anchor="middle"
      font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" font-weight="600"
      fill="#9aa4b2" letter-spacing="8">HELLO, I'M</text>

    <!-- name (flowing gradient + glow) -->
    <use xlink:href="#nameText" fill="url(#nameGrad)" filter="url(#glow)"/>
    <!-- shine sweep clipped to name -->
    <g clip-path="url(#nameClip)">
      <rect class="shine" x="0" y="90" width="1200" height="110" fill="url(#shine)"/>
    </g>

    <!-- animated underline -->
    <rect class="uline" x="470" y="204" width="260" height="4" rx="2" fill="url(#underlineGrad)"/>

    <!-- role slot machine -->
    <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="600">
      <text x="470" y="258" text-anchor="start" fill="#c7d0dc">I build&#160;</text>
    </g>
    <g clip-path="url(#roleWindow)">
      <g class="slot" font-family="'Segoe UI', Helvetica, Arial, sans-serif"
         font-size="34" font-weight="700" fill="#22d3ee">
        <text x="600" y="258" text-anchor="start" filter="url(#softGlow)">custom PCBs</text>
        <text x="600" y="310" text-anchor="start" filter="url(#softGlow)">embedded systems</text>
        <text x="600" y="362" text-anchor="start" filter="url(#softGlow)">power electronics</text>
        <text x="600" y="414" text-anchor="start" filter="url(#softGlow)">RISC-V cores</text>
        <text x="600" y="466" text-anchor="start" filter="url(#softGlow)">flight hardware</text>
        <text x="600" y="518" text-anchor="start" filter="url(#softGlow)">custom PCBs</text>
      </g>
    </g>
    <!-- blinking cursor -->
    <rect class="cursor" x="600" y="230" width="3" height="34" fill="#22d3ee" opacity="0"/>

    <!-- tagline -->
    <text x="600" y="332" text-anchor="middle"
      font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500"
      fill="#7f8a99" letter-spacing="3">ELECTRICAL &amp; COMPUTER ENGINEER · UT AUSTIN · AVAILABLE SUMMER 2027</text>

    <!-- glowing border -->
    <rect class="brd" x="1" y="1" width="1198" height="378" rx="24" fill="none"
      stroke="url(#underlineGrad)" stroke-width="2"/>
  </g>
</svg>
